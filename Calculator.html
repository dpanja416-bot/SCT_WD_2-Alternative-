<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DOM Calculator</title>
  <style>
    body {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100vh;
  background: linear-gradient(135deg, #ae00ff, #1728be,#0eb7d9,#0ae11c,#e4e407,#f69503,#ee0505);
  font-family: 'Poppins', sans-serif;
  margin: 0;
}
.head h1 {
  text-align: center;
  color: #333;
  margin-bottom: 60px;
  font-weight: 600;
}
.calculator {
  background: #fff;
  border-radius: 16px;
  box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
  padding: 20px;
  width: 320px;
}
.display {
  width: 100%;
  height: 60px;
  background: #f3f3f3;
  border: none;
  border-radius: 10px;
  font-size: 26px;
  text-align: right;
  padding: 10px;
  margin-bottom: 15px;
  outline: none;
}
.buttons {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
}
.btn {
  padding: 20px;
  font-size: 20px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.15s ease-in-out;
  background: #e0e0e0;
  box-shadow: 0 3px 6px rgba(0, 0, 0, 0.1);
}
.btn:hover {
  background: #d1d1d1;
}
.btn:active {
  transform: scale(0.97);
}
.op {
  background: #6c63ff;
  color: white;
}
/* Fix + button size perfectly */
.op[data-value="+"] {
  font-size: 22px;
  line-height: normal;
}
.equal {
  background: #00b894;
  color: white;
}
.equal:hover {
  background: #019875;
}
.clear {
  background: #ff7675;
  color: white;
}
.clear:hover {
  background: #d63031;
}
/* Zero button spans two columns */
.zero {
  grid-column: span 2;
}
  </style>
</head>
<body>
  <div class="head">
    <h1>Basic Calculator</h1>
  </div>

  <div class="calculator">
    <input type="text" id="display" class="display" placeholder="0" readonly />

    <div class="buttons">
      <button class="btn clear" data-value="C">C</button>
      <button class="btn op" data-value="(">(</button>
      <button class="btn op" data-value=")">)</button>
      <button class="btn op" data-value="/">÷</button>

      <button class="btn" data-value="7">7</button>
      <button class="btn" data-value="8">8</button>
      <button class="btn" data-value="9">9</button>
      <button class="btn op" data-value="*">×</button>

      <button class="btn" data-value="4">4</button>
      <button class="btn" data-value="5">5</button>
      <button class="btn" data-value="6">6</button>
      <button class="btn op" data-value="-">−</button>

      <button class="btn" data-value="1">1</button>
      <button class="btn" data-value="2">2</button>
      <button class="btn" data-value="3">3</button>
      <button class="btn op" data-value="+">+</button>

      <button class="btn zero" data-value="0">0</button>
      <button class="btn" data-value=".">.</button>
      <button class="btn equal" data-value="=">=</button>
    </div>
  </div>

  <script>const display = document.getElementById('display');
const buttons = document.querySelectorAll('.btn');
buttons.forEach((btn) => {
  btn.addEventListener('click', () => handleInput(btn.dataset.value));
});
document.addEventListener('keydown', (e) => {
  const key = e.key;

  if (/^[0-9+\-*/().]$/.test(key)) {
    handleInput(key);
  } else if (key === 'Enter' || key === '=') {
    e.preventDefault();
    handleInput('=');
  } else if (key === 'Backspace') {
    display.value = display.value.slice(0, -1);
  } else if (key.toLowerCase() === 'c') {
    display.value = '';
  }
});
function handleInput(value) {
  if (value === 'C') {
    display.value = '';
    return;
  }

  if (value === '=') {
    evaluateExpression();
    return;
  }

  display.value += value;
}
function evaluateExpression() {
  try {
    const expression = display.value;
    const result = Function('"use strict";return (' + expression + ')')();
    if (result === undefined || isNaN(result)) throw new Error('Invalid');
    display.value = result;
  } catch (error) {
    display.value = 'Error';
    setTimeout(() => (display.value = ''), 1000);
  }
}
</script>
</body>
</html>
